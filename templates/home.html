<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Recommendation System</title>


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    >


    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    >


    <!-- Autocomplete -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@7.2.0/dist/css/autoComplete.min.css"
    >


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='style.css') }}"
    >


    <script>

        const films = { { suggestions | tojson } };

    </script>

</head>


<body class="home-page">


    <main class="home-container">


        <div class="hero-content">


            <div class="logo-icon">

                <i class="fa fa-film"></i>

            </div>


          


            <h1>
                Movie Recommendation
                <span>System</span>
            </h1>


            <p class="hero-description">

                Discover movies similar to the ones you already love.
                Search for a movie and let our recommendation engine
                find your next watch.

            </p>


            <!-- Search -->

            <div class="search-wrapper">

                <div class="search-icon">

                    <i class="fa fa-search"></i>

                </div>


                <input
                    type="text"
                    name="movie"
                    class="movie"
                    id="autoComplete"
                    autocomplete="off"
                    placeholder="Search for a movie..."
                    required
                >

            </div>


            <!-- Button -->

            <button
                class="movie-button"
                disabled
            >

                <span>
                    Get Recommendations
                </span>

                <i class="fa fa-arrow-right"></i>

            </button>


            <p class="search-hint">

                Try: Avatar, Inception, Titanic, Interstellar

            </p>

        </div>


    </main>


    <!-- Error -->

    <div class="fail">

        <div class="fail-box">

            <i class="fa fa-exclamation-circle"></i>

            <h3>
                Movie not found
            </h3>

            <p>
                Please select a movie from the suggestions
                or check the spelling.
            </p>

        </div>

    </div>


    <!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- Autocomplete Library -->

<!-- Movie List for Autocomplete -->
<script>
    window.films = {{ suggestions | tojson | safe }};
</script>

<!-- Custom Autocomplete -->
<script src="{{ url_for('static', filename='autocomplete.js') }}"></script>

<!-- Recommendation JS -->
<script src="{{ url_for('static', filename='recommend.js') }}"></script>

</body>
</html>
